<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Smart Emergency Response</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Smart Emergency Response</div>
  <nav>
    <a href="index.html">Report</a>
    <a href="register.html">Register</a>
  </nav>
</div>

<div class="auth-shell">
  <h2 class="text-center">Welcome back</h2>
  <p class="form-note" style="margin-top:-6px;">Log in to report an emergency or view your dashboard.</p>

  <div id="alertBox"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="Your password">

    <button type="submit" class="btn btn-primary btn-block mt-lg">Log in</button>
  </form>

  <p class="form-note">Admin/responder demo login: <strong>admin@emergency.local</strong> / <strong>Admin@123</strong></p>
  <p class="form-note">No account yet? <a href="register.html">Register</a></p>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };

  try {
    const data = await apiRequest('/api/auth/login', 'POST', payload);
    saveSession(data.token, data.user);
    showAlert('alertBox', 'Login successful! Redirecting…', 'success');
    setTimeout(() => {
      window.location.href = (data.user.role === 'admin' || data.user.role === 'responder')
        ? 'dashboard.html'
        : 'index.html';
    }, 600);
  } catch (err) {
    showAlert('alertBox', err.message, 'error');
  }
});
</script>
</body>
</html>
